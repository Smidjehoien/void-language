name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    # Note: we use `pull_request` instead of `pull_request_target` to avoid
    # running with elevated privileges on code from forks.
    types: [opened]

permissions: {}
# NOTE: Default token permissions are disabled; jobs must explicitly set the minimal permissions they need.

jobs:
  greeting:
    if: '!endsWith(github.actor, ''[bot]'')'
    runs-on: ubuntu-latest
    permissions:
      # Note: PR greetings are posted via the Issues API; `pull-requests: read` is only used
      # to check whether a user has opened a PR before.
      issues: write
      pull-requests: read
    steps:
      - uses: actions/first-interaction@3c71ce730280171fd1cfb57c00c774f8998586f7 # Pinned by SHA; verify upstream tag before merging Dependabot bumps
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening your first issue!

            Please avoid sharing secrets, tokens, or internal URLs in public logs.
            If this might be a security vulnerability, follow SECURITY.md.
          pr_message: |
            Thanks for your first pull request!

            Please make sure you don't commit secrets or sensitive data.
            If your change is security-related, follow the guidance in SECURITY.md.
