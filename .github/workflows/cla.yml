name: CLA marker
on:
  pull_request_target:
    # Needs to label PRs from forks (requires base-repo write perms).
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cla:
    uses: Smidjehoien/.github/.github/workflows/cla-mark.yml@main
    with:
      cover_org_members: true
      cover_collaborators: false
      # Users covered by policy (maintainers / automation).
      # humans: cosmicjesterx
      # bots: charliehelps, charliecreates[bot]
      allowlist_users: 'cosmicjesterx, charliehelps, charliecreates[bot]'
      create_missing_labels: true
